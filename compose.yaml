services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adaptive_learning}
      POSTGRES_USER: ${POSTGRES_USER:-adaptive_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adaptive_user} -d ${POSTGRES_DB:-adaptive_learning}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
